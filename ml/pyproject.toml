[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimvision-ml"
version = "0.1.0"
description = "ClaimVision AI machine-learning library: fraud, severity, detection, costing, and pipeline modules."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary — internal prototype only" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
