project:
  name: claimvision-ai
  random_seed: 42
  timezone: Asia/Kolkata

paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  manifests: data/manifests
  models: artifacts/models
  runs: artifacts/runs
  reports: artifacts/reports

image:
  supported_extensions: [".jpg", ".jpeg", ".png", ".webp"]
  max_upload_mb: 15
  min_width: 224
  min_height: 224

fraud:
  architecture: mobilenet_v2
  image_size: [224, 224]
  positive_label: suspicious
  threshold_source: validation

severity:
  candidates: [baseline_cnn, mobilenet_v2, vit_tiny]
  image_size: [224, 224]
  labels: [minor, moderate, severe]

detection:
  damage_model_family: yolo
  part_model_family: yolo
  image_size: 640

api:
  prefix: /api/v1
  max_upload_mb: 15
  docs_enabled: true

demo:
  fixture_directory: demo/fixtures
  scenarios: [minor_valid, major_valid, suspicious, poor_quality]

